name = "economical-used-cars-backend"
main = "src/worker.js"
compatibility_date = "2026-04-28"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "cars-db"
database_id = "PASTE_YOUR_ACTUAL_D1_ID_HERE"

# R2 Storage Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cars-images"
